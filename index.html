<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview-Instrument · To Trust the Machine?</title>

<style>
  :root{
    --paper:#F5F7F8; --surface:#FFFFFF;
    --ink:#101820; --muted:#5B6874; --faint:#8A97A3; --rule:#DCE2E7;
    --signal:#1B3A6B; --soft:#E8EDF5;
    --live:#A66A00; --over:#9E2A1C; --ok:#1F6B4A;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  textarea,input{font-family:inherit;font-size:inherit;color:inherit}
  h1{font-size:25px;font-weight:640;letter-spacing:-0.022em;margin:2px 0 6px;line-height:1.2}
  h2{font-size:19px;font-weight:620;letter-spacing:-0.02em;margin:0 0 4px}

  .bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.25}
  .brand b{font-size:13px;font-weight:650;letter-spacing:-0.01em}
  .brand span{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase}
  .spacer{flex:1}

  .clock{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;min-width:98px}
  .clock.is-live{color:var(--live)} .clock.is-over{color:var(--over)}

  .btn{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:6px 12px;font-size:13px;font-weight:500;transition:border-color .12s,background .12s}
  .btn:hover{border-color:var(--faint)}
  .btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .btn-primary{background:var(--signal);border-color:var(--signal);color:#fff}
  .btn-primary:hover{background:#16305A;border-color:#16305A}
  .btn-quiet{border-color:transparent;color:var(--muted)}
  .btn-quiet:hover{border-color:var(--rule);color:var(--ink)}
  .btn-danger{color:var(--over);border-color:#EBD2CE}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .code-input{font-family:var(--mono);font-size:14px;font-weight:600;width:62px;text-align:center;border:1px solid var(--rule);border-radius:5px;padding:6px 4px;background:var(--paper)}
  .tabs{display:flex;gap:3px;background:var(--paper);padding:3px;border-radius:6px}
  .tab{border:none;background:transparent;padding:6px 12px;border-radius:4px;font-size:13px;font-weight:500;color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,32,.09)}

  .save{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
  .save.on .dot{background:var(--ok)} .save.on{color:var(--ok)}
  .save.busy .dot{background:var(--live)} .save.busy{color:var(--live)}
  .save.off .dot{background:var(--over)} .save.off{color:var(--over)}

  .wrap{display:grid;grid-template-columns:126px minmax(0,1fr);max-width:1160px;margin:0 auto}
  .view{padding:28px 24px 110px}
  .view[hidden]{display:none}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--signal);font-weight:600}
  .srq{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:24px}
  .lede{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:62ch}

  .gutter{position:sticky;top:55px;align-self:start;height:calc(100vh - 55px);padding:28px 0 28px 18px;border-right:1px solid var(--rule)}
  .rail{position:relative;height:100%;max-height:620px}
  .seg{position:absolute;left:0;right:12px;border-left:2px solid var(--rule);padding-left:9px;display:flex;flex-direction:column;background:none;text-align:left;border-top:none;border-right:none;border-bottom:none;color:var(--muted)}
  .seg:hover{border-left-color:var(--faint)}
  .seg[aria-current="true"]{border-left-color:var(--signal);color:var(--ink)}
  .seg-k{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em}
  .seg-t{font-family:var(--mono);font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .playhead{position:absolute;left:-4px;right:0;height:0;border-top:1px solid var(--live);pointer-events:none;transition:top .9s linear}
  .playhead::before{content:"";position:absolute;left:-4px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--live)}
  .playhead.is-over{border-top-color:var(--over)} .playhead.is-over::before{background:var(--over)}

  .q{border-top:1px solid var(--rule);padding:17px 0 13px}
  .q:first-of-type{border-top:none}
  .q-top{display:flex;gap:12px;align-items:baseline}
  .q-id{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint);min-width:32px;padding-top:3px}
  .q-text{font-size:17px;line-height:1.42;font-weight:480;letter-spacing:-0.011em;flex:1;margin:0}
  .q.is-key .q-id{color:var(--signal)} .q.is-key .q-text{font-weight:560}
  .keytag{display:inline-block;vertical-align:2px;margin-left:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--soft);color:var(--signal);padding:2px 6px;border-radius:3px;font-weight:600}
  .probe{margin:8px 0 0 44px;padding-left:11px;border-left:1px solid var(--rule);color:var(--muted);font-size:13.5px;font-style:italic}
  .qopts{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 0 44px}
  .qopt{border:1px solid var(--rule);background:var(--surface);border-radius:6px;
    padding:9px 14px;font-size:14.5px;font-weight:500;transition:border-color .12s,background .12s}
  .qopt:hover{border-color:var(--signal)}
  .qopt[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
  .exline{margin:8px 0 0 44px;font-size:13.5px;color:var(--ink);background:var(--soft);
    border-radius:0 5px 5px 0;border-left:2px solid var(--signal);padding:8px 11px;max-width:66ch}
  .exline span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--signal);font-weight:700;display:block;margin-bottom:2px}
  .brief{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:6px 18px 8px;margin:0 0 26px}
  .brief p{font-size:14.5px;line-height:1.6;color:var(--muted);margin:12px 0}
  .brief b{color:var(--ink);font-weight:600}
  .why{margin:7px 0 0 44px;font-size:12.5px;color:var(--faint);max-width:62ch}
  .q-tools{display:flex;gap:8px;margin:10px 0 0 44px}
  .note{flex:1;min-height:38px;resize:vertical;border:1px solid var(--rule);border-radius:5px;padding:8px 10px;background:var(--surface);font-size:14px;line-height:1.5}
  .note:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  .stamp{white-space:nowrap;font-family:var(--mono);font-size:11.5px;padding:8px 10px}
  .stamps{margin:8px 0 0 44px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--signal);border:none;border-radius:3px;padding:3px 7px;font-weight:600}
  .chip:hover{text-decoration:line-through}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;padding-top:18px;border-top:1px solid var(--rule)}

  .panel{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:18px;margin-bottom:20px}
  .panel h3{margin:0 0 3px;font-size:15px;font-weight:620;letter-spacing:-0.01em}
  .panel p{margin:0 0 14px;font-size:13px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--rule)}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;width:58px}
  .bar-cell{position:relative}
  .bar-fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--soft);border-radius:2px;z-index:0;transition:width .4s}
  .bar-cell span{position:relative;z-index:1}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .field input{border:1px solid var(--rule);border-radius:5px;padding:7px 9px;background:var(--surface)}
  .warn{border-left:3px solid var(--live);background:#FFF9EF;padding:12px 14px;border-radius:0 6px 6px 0;font-size:13px;color:#6B4A0F;margin-bottom:20px}
  .warn b{font-weight:640}
  .warn.bad{border-left-color:var(--over);background:#FDF3F1;color:#6E2118}
  .warn.good{border-left-color:var(--ok);background:#F0F7F3;color:#1B5238}

  .roomcode{font-family:var(--mono);font-size:clamp(48px,11vw,104px);font-weight:700;letter-spacing:.14em;line-height:1;color:var(--signal);margin:6px 0 4px}
  .roomhint{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .joined{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .pill{font-family:var(--mono);font-size:11.5px;font-weight:600;border:1px solid var(--rule);border-radius:20px;padding:4px 11px;color:var(--muted)}
  .pill.done{border-color:var(--ok);color:var(--ok);background:#F0F7F3}

  .split{margin-bottom:16px}
  .split-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;gap:12px}
  .split-h b{font-weight:560}
  .split-bar{display:flex;height:32px;border-radius:5px;overflow:hidden;background:var(--paper);border:1px solid var(--rule)}
  .split-a,.split-b{display:flex;align-items:center;font-family:var(--mono);font-size:12px;font-weight:700;transition:width .5s}
  .split-a{background:var(--signal);color:#fff;justify-content:flex-start;padding-left:9px}
  .split-b{background:var(--soft);color:var(--signal);justify-content:flex-end;padding-right:9px}

  .ex{max-width:780px;margin:0 auto}
  .pair{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:16px 18px;margin-bottom:12px}
  .pair-q{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;margin-bottom:11px}
  .pair-opts{display:grid;grid-template-columns:1fr 30px 1fr;gap:8px}
  .opt{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:15px 16px;font-size:16px;font-weight:490;line-height:1.35;text-align:left;transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--signal);background:var(--surface)}
  .opt[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:560}
  .vs{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .cards{list-style:none;margin:0;padding:0}
  .card{display:flex;align-items:center;gap:11px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:11px 13px;margin-bottom:7px;transition:border-color .12s,box-shadow .12s}
  .card.dragging{opacity:.35}
  .card.over{border-color:var(--signal);box-shadow:0 0 0 2px var(--soft)}
  .card.top3{border-color:var(--signal)}
  .card.top3 .rank{background:var(--signal);color:#fff}
  .rank{font-family:var(--mono);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper);color:var(--muted);width:26px;height:26px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center}
  .card-label{flex:1;font-size:15.5px;line-height:1.3}
  .grip{cursor:grab;color:var(--faint);font-family:var(--mono);font-size:13px;user-select:none}
  .move{border:1px solid var(--rule);background:var(--surface);border-radius:4px;width:30px;height:28px;line-height:1;padding:0;color:var(--muted)}
  .move:hover{border-color:var(--signal);color:var(--signal)}
  .final{margin-top:24px;border-top:1px solid var(--rule);padding-top:18px}

  .scene{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:15.5px;line-height:1.5;margin:0 0 20px;color:var(--ink)}
  .scene{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:15.5px;line-height:1.5;margin:0 0 20px;color:var(--ink)}
  .pstage{max-width:600px;margin:0 auto;padding:34px 20px 90px}
  .pstage .opt{padding:22px 20px;font-size:19px;margin-bottom:10px;width:100%}
  .pq{font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;margin:0 0 22px}
  .dots{display:flex;gap:6px;margin-bottom:26px}
  .pdot{width:26px;height:3px;border-radius:2px;background:var(--rule)}
  .pdot.on{background:var(--signal)}
  .pdot.now{background:var(--live)}
  .bigcode{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.22em;text-align:center;text-transform:uppercase;width:100%;border:1px solid var(--rule);border-radius:8px;padding:16px 10px;background:var(--surface)}
  .bigcode:focus{outline:2px solid var(--signal);outline-offset:1px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .foot{max-width:74ch;margin:0 auto;padding:0 24px 56px;font-size:12px;color:var(--faint)}

  @media (max-width:820px){
    .wrap{grid-template-columns:1fr}
    .gutter{display:none}
    .q-tools,.probe,.why,.stamps{margin-left:0}
    .pair-opts{grid-template-columns:1fr;gap:6px} .vs{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="bar" id="topbar">
  <div class="brand"><b>To Trust the Machine?</b><span id="modeLabel">Moderation</span></div>
  <span id="modChrome" style="display:none;align-items:center;gap:16px"><input class="code-input" id="pcode" value="I1" maxlength="4" aria-label="Teilnehmercode">

  <div class="tabs" role="tablist">

    <button class="tab" role="tab" aria-selected="false" data-view="rank">Abwägung</button>
    <button class="tab" role="tab" aria-selected="false" data-view="transcript">Transkript</button>

  </span><button class="btn btn-quiet" id="switchBtn">•••</button>

</div>

<script>
"use strict";

/* ═══ 1 · Speicherschicht ═══════════════════════════════════
   cloud  – window.storage, geteilte Schlüssel → Live-Raum möglich
   local  – localStorage, nur dieses Gerät → kein Live-Raum
   memory – überlebt keinen Neuladen → Export erzwingen
   ═══════════════════════════════════════════════════════════ */
const DB = (()=>{
  let kind="memory"; const mem=new Map();
  const mk=(k,sh)=>(sh?"S|":"P|")+k;
  try{
    if(typeof window.storage==="object" && window.storage && typeof window.storage.set==="function") kind="cloud";
    else { const t="__ttm_probe"; localStorage.setItem(t,"1"); localStorage.removeItem(t); kind="local"; }
  }catch(_){ kind="memory"; }

  async function get(key,shared){
    try{
      if(kind==="cloud"){ const r=await window.storage.get(key,shared); return r?JSON.parse(r.value):null; }
      if(kind==="local"){ const v=localStorage.getItem(mk(key,shared)); return v?JSON.parse(v):null; }
      const v=mem.get(mk(key,shared)); return v!==undefined?JSON.parse(v):null;
    }catch(_){ return null; }
  }
  async function set(key,value,shared){
    const s=JSON.stringify(value);
    if(kind==="cloud"){ const r=await window.storage.set(key,s,shared); if(!r) throw new Error("set failed"); return true; }
    if(kind==="local"){ localStorage.setItem(mk(key,shared),s); return true; }
    mem.set(mk(key,shared),s); return true;
  }
  async function del(key,shared){
    try{
      if(kind==="cloud"){ await window.storage.delete(key,shared); return true; }
      if(kind==="local"){ localStorage.removeItem(mk(key,shared)); return true; }
      mem.delete(mk(key,shared)); return true;
    }catch(_){ return false; }
  }
  async function list(prefix,shared){
    try{
      if(kind==="cloud"){ const r=await window.storage.list(prefix,shared); return r?r.keys:[]; }
      const src = kind==="local" ? Object.keys(localStorage) : [...mem.keys()];
      const p=mk(prefix,shared);
      return src.filter(k=>k.startsWith(p)).map(k=>k.slice(2));
    }catch(_){ return []; }
  }
  return {get,set,del,list, get kind(){return kind}, get canRoom(){return kind==="cloud"}};
})();

let lang="de", blockIdx=0, running=false, elapsed=0, tickRef=null;

const S={code:"I1",meta:{ind:"",fun:"",sen:"",fmt:"",age:"",tec:"",dat:new Date().toISOString().slice(0,10)},
         notes:{},stamps:{},pairs:{},order:FACTORS.map(f=>f.id),anchor:"",quotes:{},transcript:"",offset:0,partWhy:"",partMissing:"",choices:{},newCodes:""};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const T=()=>UI[lang], L=o=>o[lang];
const F=id=>L(FACTORS.find(f=>f.id===id));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._r);t._r=setTimeout(()=>t.classList.remove("show"),1800)}

function setSaveState(k){
  const el=$("#saveState"); if(!el) return;
  el.className="save "+(k==="busy"?"busy":k==="on"?"on":"off");
  $("#saveText").textContent = k==="busy"?T().saveBusy : k==="on"?T().saveOn : T().saveOff;
}
function markSave(){
  if(DB.kind==="memory") return;
  clearTimeout(saveTimer); setSaveState("busy");
  saveTimer=setTimeout(doSave,1200);
}
async function doSave(){
  if(DB.kind==="memory") return;
  try{
    if(ownedCode!==S.code){
      // Unter diesem Code liegt womöglich ein anderes Interview — nie stumm überschreiben.
      const ex=await DB.get("ttm:session:"+S.code,false);
      if(ex){
        setSaveState("off");
        toast(lang==="de"
          ? "Unter "+S.code+" liegt bereits eine gespeicherte Sitzung — sie wird nicht überschrieben. Im Reiter „Daten“ laden oder oben einen anderen Teilnehmercode wählen."
          : "A session is already saved under "+S.code+" — it will not be overwritten. Load it in the Data tab or choose a different participant code.");
        return;
      }
    }
    await DB.set("ttm:session:"+S.code,{...snapshot(),savedAt:Date.now()},false);
    ownedCode=S.code; setSaveState("on");
  }
  catch(_){ setSaveState("off"); }
}

/* ═══ 4 · Uhr & Zeitleiste ═════════════════════════════════ */
const TOTAL=BLOCKS.reduce((a,b)=>a+b.min,0);
function paintClock(){
  const c=$("#clock"); c.textContent=mmss(elapsed);
  c.classList.toggle("is-live",running&&elapsed<=TOTAL*60000);
  c.classList.toggle("is-over",elapsed>TOTAL*60000);
}
function paintPlayhead(){
  const ph=$("#playhead"); if(!ph) return;
  ph.style.top=(Math.min(1,elapsed/(TOTAL*60000))*100)+"%";
  ph.classList.toggle("is-over",elapsed>TOTAL*60000);
}
function buildRail(){
  if(!BLOCKS.length) return;
  const rail=$("#rail"); rail.innerHTML=""; let acc=0;
  BLOCKS.forEach((b,i)=>{
    const el=document.createElement("button");
    el.className="seg"; el.style.top=(acc/TOTAL*100)+"%"; el.style.height=(b.min/TOTAL*100)+"%";
    el.setAttribute("aria-current",i===blockIdx?"true":"false");
    el.innerHTML='<span class="seg-k">'+b.k+'</span><span class="seg-t">'+String(Math.round(acc)).padStart(2,"0")+'′</span>';
    el.onclick=()=>{blockIdx=i;renderGuide()};
    rail.appendChild(el); acc+=b.min;
  });
  const ph=document.createElement("div"); ph.className="playhead"; ph.id="playhead"; ph.style.top="0%";
  rail.appendChild(ph); paintPlayhead();
}

function renderGuide(){
  if(!BLOCKS.length) return;
  const b=BLOCKS[blockIdx], v=$("#view-session");
  v.innerHTML=
    '<p class="eyebrow">'+(["0","W","Z","E"].includes(b.k)?esc(L(b).t):"Block "+b.k)+' · '+b.min+' min</p>'+
    '<h1>'+esc(L(b).t)+'</h1><div class="srq">'+esc(b.srq)+'</div>'+
    (L(b).s?'<p class="lede" style="margin:-12px 0 22px">'+esc(L(b).s)+'</p>':'')+
    (b.brief?'<div class="brief">'+L(b.brief).map(function(x){return '<p>'+x+'</p>'}).join("")+'</div>':'')+
    b.qs.map(q=>{
      const st=(S.stamps[q.id]||[]).map(t=>'<button class="chip" data-drop="'+q.id+'" data-t="'+t+'">'+mmss(t)+'</button>').join("");
      return '<div class="q'+(q.key?" is-key":"")+'">'+
        '<div class="q-top"><div class="q-id">'+q.id+'</div><p class="q-text">'+esc(L(q))+
        (q.key?'<span class="keytag">'+(lang==="de"?"nicht kürzen":"do not cut")+'</span>':'')+'</p></div>'+
        (q.probe?'<div class="probe">'+esc(L(q.probe))+'</div>':'')+
        (q.opts?'<div class="qopts">'+q.opts.map(function(o){
          return '<button class="qopt" data-qo="'+q.id+'" data-o="'+o.id+'" aria-pressed="'+(S.choices[q.id]===o.id)+'">'+esc(L(o))+'</button>'
        }).join("")+'</div>':'')+
        (q.ex?'<div class="exline"><span>'+(lang==="de"?"so gemeint":"how to ask")+'</span>'+esc(L(q.ex))+'</div>':'')+
        (q.why?'<div class="why">'+esc(L(q.why))+'</div>':'')+
        '<div class="q-tools"><textarea class="note" data-q="'+q.id+'" placeholder="'+T().notePh+'">'+esc(S.notes[q.id]||"")+'</textarea>'+
        '<button class="btn stamp" data-mark="'+q.id+'">'+T().stamp+'</button></div>'+
        (st?'<div class="stamps">'+st+'</div>':'')+'</div>';
    }).join("")+
    '<div class="nav"><button class="btn" id="prevB"'+(blockIdx===0?" disabled":"")+'>← '+T().prev+'</button>'+
    '<button class="btn btn-primary" id="nextB"'+(blockIdx===BLOCKS.length-1?" disabled":"")+'>'+T().next+' →</button></div>';

  v.querySelectorAll(".note").forEach(t=>t.addEventListener("input",e=>{S.notes[e.target.dataset.q]=e.target.value;markSave()}));
  v.querySelectorAll("[data-qo]").forEach(function(b){
    b.onclick=function(){
      const q=b.dataset.qo;
      S.choices[q] = (S.choices[q]===b.dataset.o) ? "" : b.dataset.o;
      markSave(); renderGuide();
    };
  });
  v.querySelectorAll("[data-mark]").forEach(x=>x.onclick=()=>{
    const id=x.dataset.mark; if(!S.stamps[id]) S.stamps[id]=[];
    S.stamps[id].push(elapsed); toast(T().stamped); markSave(); renderGuide();
  });
  v.querySelectorAll("[data-drop]").forEach(c=>c.onclick=()=>{
    const id=c.dataset.drop,t=+c.dataset.t;
    S.stamps[id]=S.stamps[id].filter(x=>x!==t); markSave(); renderGuide();
  });
  const p=$("#prevB"),n=$("#nextB");
  if(p)p.onclick=()=>{blockIdx--;renderGuide()};
  if(n)n.onclick=()=>{blockIdx++;renderGuide()};
  $$(".seg").forEach((s,i)=>s.setAttribute("aria-current",i===blockIdx?"true":"false"));
}

function renderRank(){
  $("#exTitle").textContent=T().exTitle; $("#exLede").textContent=T().exLede;
  $("#sortTitle").textContent=T().sortTitle; $("#sortLede").textContent=T().sortLede;
  $("#anchorTitle").textContent=T().anchorTitle; $("#anchorLede").textContent=T().anchorLede;
  $("#anchorNote").value=S.anchor;
  const cmp=document.getElementById("cmpBox");
  if(cmp){
    const h=analyseHtml({choices:S.choices,pairs:S.pairs,order:S.order},true);
    cmp.innerHTML = h ? '<h2 style="font-size:19px;margin:0 0 4px">'+(lang==="de"?"Vergleich der Antworten":"Comparing the answers")+'</h2>'+
      '<p class="lede">'+(lang==="de"
        ? "Ergibt sich aus Vignette, Leiter und Abwägung. Die kursiven Zeilen sind Nachfassfragen für das Gespräch."
        : "Derived from the vignette, the ladder and the trade-offs. The italic lines are follow-up probes.")+'</p>'+h : "";
  }
  const extra=document.getElementById("partExtra");
  if(extra){
    const bits=[];
    if(S.partWhy.trim()) bits.push({k:(lang==="de"?"Warum Platz 1 oben steht":"Why first place is at the top"),v:S.partWhy});
    if(S.partMissing.trim()) bits.push({k:(lang==="de"?"Fehlender Faktor":"Missing factor"),v:S.partMissing});
    extra.innerHTML = bits.length ? bits.map(function(b){
      return '<div style="margin-top:14px"><div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;'+
        'text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:4px">'+b.k+'</div>'+
        '<p style="margin:0;font-size:15px">'+esc(b.v)+'</p></div>'}).join("") : "";
  }

  $("#pairs").innerHTML=PAIRS.map((p,i)=>
    '<div class="pair"><div class="pair-q">'+String(i+1).padStart(2,"0")+' — '+(lang==="de"?"Was wiegt schwerer?":"Which weighs more?")+'</div>'+
    '<div class="pair-opts"><button class="opt" data-p="'+p.id+'" data-c="a" aria-pressed="'+(S.pairs[p.id]==="a")+'">'+esc(F(p.a))+'</button>'+
    '<div class="vs">'+(lang==="de"?"od.":"or")+'</div>'+
    '<button class="opt" data-p="'+p.id+'" data-c="b" aria-pressed="'+(S.pairs[p.id]==="b")+'">'+esc(F(p.b))+'</button></div></div>').join("");
  $$("#pairs .opt").forEach(b=>b.onclick=()=>{S.pairs[b.dataset.p]=b.dataset.c;markSave();renderRank()});

  const ul=$("#cards");
  ul.innerHTML=S.order.map((id,i)=>
    '<li class="card'+(i<3?" top3":"")+'" draggable="true" data-id="'+id+'">'+
    '<span class="grip" aria-hidden="true">⠿</span><span class="rank">'+(i+1)+'</span>'+
    '<span class="card-label">'+esc(F(id))+'</span>'+
    '<button class="move" data-up="'+id+'" aria-label="hoch">↑</button>'+
    '<button class="move" data-dn="'+id+'" aria-label="runter">↓</button></li>').join("");
  ul.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{shiftIn(S,b.dataset.up,-1);markSave();renderRank()});
  ul.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{shiftIn(S,b.dataset.dn,1);markSave();renderRank()});
  wireDrag(ul,S,()=>{markSave();renderRank()});
}
function shiftIn(store,id,d){
  const i=store.order.indexOf(id),j=i+d;
  if(j<0||j>=store.order.length)return;
  const t=store.order[i]; store.order[i]=store.order[j]; store.order[j]=t;
}
function wireDrag(ul,store,redraw){
  let dragId=null;
  ul.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("dragstart",e=>{dragId=card.dataset.id;card.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
    card.addEventListener("dragend",()=>{card.classList.remove("dragging");
      ul.querySelectorAll(".card").forEach(c=>c.classList.remove("over"))});
    card.addEventListener("dragover",e=>{e.preventDefault();card.classList.add("over")});
    card.addEventListener("dragleave",()=>card.classList.remove("over"));
    card.addEventListener("drop",e=>{
      e.preventDefault(); const tgt=card.dataset.id;
      if(!dragId||dragId===tgt)return;
      const arr=store.order.filter(x=>x!==dragId);
      arr.splice(arr.indexOf(tgt),0,dragId);
      store.order=arr; redraw();
    });
  });
}

/* ═══ 7 · Live-Raum (Moderation) ═══════════════════════════ */
const ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ";
const newCode=()=>Array.from({length:4},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");

async function openRoom(){
  const code=newCode();
  try{
    await DB.set("ttm:room:"+code,{code,openedAt:Date.now(),session:S.code},true);
    room={code,people:[]}; startPoll(); renderRoom();
  }catch(_){ toast("!"); }
}
function closeRoom(){ stopPoll(); room=null; renderRoom(); }
async function deleteRoom(){
  if(!room) return;
  const code=room.code;
  const keys=await DB.list("ttm:room:"+code,true);
  for(const k of keys) await DB.del(k,true);
  await DB.del("ttm:room:"+code,true);
  stopPoll(); room=null; renderRoom();
  toast(lang==="de"?"Raumdaten gelöscht":"Room data deleted");
}
function startPoll(){ stopPoll(); pollRoom(); roomPoll=setInterval(pollRoom,4000); }
function stopPoll(){ if(roomPoll) clearInterval(roomPoll); roomPoll=null; }

async function pollRoom(){
  if(!room) return;
  const keys=await DB.list("ttm:room:"+room.code+":p:",true);
  const out=[];
  for(const k of keys){ const v=await DB.get(k,true); if(v) out.push(v); }
  out.sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
  room.people=out;
  if(!$("#view-room").hidden) renderRoom();
}

function renderRoom(){
  const v=$("#view-room"), t=T();
  if(!DB.canRoom){
    v.innerHTML='<p class="eyebrow">Block E · SRQ5</p><h1>'+t.roomTitle+'</h1><div class="warn bad">'+t.wLocal+'</div>';
    return;
  }
  if(!room){
    v.innerHTML='<p class="eyebrow">Block E · SRQ5</p><h1>'+t.roomTitle+'</h1><p class="lede">'+t.roomLede+'</p>'+
      '<div class="panel"><p style="margin:0 0 14px">'+t.roomNone+'</p>'+
      '<button class="btn btn-primary" id="openRoom">'+t.roomOpen+'</button></div>';
    $("#openRoom").onclick=openRoom; return;
  }

  const done=room.people.filter(p=>p.done).length;
  const ranks={}; FACTORS.forEach(f=>ranks[f.id]=[]);
  room.people.forEach(p=>(p.order||[]).forEach((id,i)=>{if(ranks[id])ranks[id].push(i+1)}));
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const sorted=FACTORS.slice().sort((x,y)=>(mean(ranks[x.id])==null?99:mean(ranks[x.id]))-(mean(ranks[y.id])==null?99:mean(ranks[y.id])));

  v.innerHTML=
    '<p class="eyebrow">Block E · SRQ5</p><h1>'+t.roomTitle+'</h1><p class="lede">'+t.roomLede+'</p>'+
    '<div class="panel" style="text-align:center;padding:26px 18px">'+
      '<div class="roomhint">'+t.enterCode+'</div>'+
      '<div class="roomcode">'+room.code+'</div>'+
      '<div class="roomhint">'+(room.people.length?t.joinedN(room.people.length):t.waiting)+'</div>'+
      '<div class="joined" style="justify-content:center">'+
        room.people.map((p,i)=>'<span class="pill'+(p.done?" done":"")+'">'+(lang==="de"?"TN":"P")+(i+1)+(p.done?" ✓":"")+'</span>').join("")+
      '</div>'+
      (room.people.length?'<div class="row" style="justify-content:center;margin-top:16px">'+
        room.people.map(function(p,i){return '<button class="btn" data-take="'+i+'">'+
          (lang==="de"?"TN":"P")+(i+1)+(lang==="de"?" in Sitzung ":" into session ")+S.code+'</button>'}).join("")+
        '</div>':'')+
      '<div class="row" style="justify-content:center;margin-top:18px">'+
        '<button class="btn" id="closeRoom">'+t.roomClose+'</button>'+
        '<button class="btn btn-danger" id="delRoom">'+t.roomDelete+'</button></div></div>'+
    '<div class="panel"><h3>'+t.aggPair+'</h3><p>'+done+' / '+room.people.length+' '+(lang==="de"?"fertig":"complete")+'</p>'+
      PAIRS.map(p=>{
        const rs=room.people.filter(x=>x.pairs&&x.pairs[p.id]);
        const na=rs.filter(x=>x.pairs[p.id]==="a").length, nb=rs.length-na, tot=Math.max(1,rs.length);
        return '<div class="split"><div class="split-h"><b>'+esc(F(p.a))+'</b><b style="text-align:right">'+esc(F(p.b))+'</b></div>'+
          '<div class="split-bar"><div class="split-a" style="width:'+(na/tot*100)+'%">'+(na||"")+'</div>'+
          '<div class="split-b" style="width:'+(nb/tot*100)+'%">'+(nb||"")+'</div></div></div>';
      }).join("")+'</div>'+
    '<div class="panel"><h3>'+t.aggRank+'</h3><p>'+(lang==="de"?"Aktualisiert sich, während Antworten eintreffen.":"Updates as answers arrive.")+'</p>'+
      '<table><tbody>'+sorted.map(f=>{
        const m=mean(ranks[f.id]); const pct=m?(1-(m-1)/(FACTORS.length-1))*100:0;
        return '<tr><td class="bar-cell"><span class="bar-fill" style="width:'+pct.toFixed(0)+'%"></span><span>'+esc(L(f))+'</span></td>'+
               '<td class="num">'+(m?m.toFixed(1):"—")+'</td></tr>';
      }).join("")+'</tbody></table></div>';

  $("#closeRoom").onclick=closeRoom;
  $("#delRoom").onclick=deleteRoom;
  v.querySelectorAll("[data-take]").forEach(function(b){
    b.onclick=function(){
      const p=room.people[+b.dataset.take]; if(!p) return;
      if(p.choices) S.choices=Object.assign({},S.choices,p.choices);
      if(p.reasons) Object.keys(p.reasons).forEach(function(k){ if(p.reasons[k]) S.notes[k]=p.reasons[k]; });
      if(p.pairs) S.pairs=Object.assign({},p.pairs);
      if(p.order&&p.order.length===FACTORS.length) S.order=p.order.slice();
      S.partWhy=p.why||""; S.partMissing=p.missing||"";
      markSave(); renderRank(); renderGuide();
      toast(lang==="de"?"In Sitzung "+S.code+" übernommen":"Copied into session "+S.code);
    };
  });
}

const HIDE="#topbar .tabs, #pcode, #clock, #toggleTimer, #resetTimer, #saveState";
function enterParticipant(){

  $("#modWrap").hidden=true; $("#partWrap").hidden=false;
  $$(HIDE).forEach(e=>e.style.display="none");

  renderPart();
}
function leaveParticipant(){

  $("#modWrap").hidden=false; $("#partWrap").hidden=true;
  $$(HIDE).forEach(e=>e.style.display="");

}
async function partJoin(code){
  code=(code||"").trim().toUpperCase();
  if(code.length!==4){ toast(T().badCode); return; }
  const meta=await DB.get("ttm:room:"+code,true);
  if(!meta){ toast(T().badCode); return; }
  P.code=code;
  P.pid=Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");
  P.joinedAt=Date.now(); P.step=0;
  await pushPart(); renderPart();
}
async function pushPart(){
  if(!P||!P.code) return;
  try{
    await DB.set("ttm:room:"+P.code+":p:"+P.pid,
      {pid:P.pid,joinedAt:P.joinedAt,pairs:P.pairs,order:P.order,done:P.done,at:Date.now()},true);
  }catch(_){}
}
function renderPart(){
  const w=$("#partWrap"), t=T();

  if(P.step===-1){
    w.innerHTML='<div class="pstage"><h1 style="font-size:27px">'+t.roomTitle+'</h1>'+
      '<p class="lede">'+t.enterHint+'</p>'+
      '<input class="bigcode" id="joinCode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">'+
      '<button class="btn btn-primary" id="joinGo" style="width:100%;margin-top:14px;padding:14px">'+t.enterGo+'</button></div>';
    const i=$("#joinCode"); i.focus();
    $("#joinGo").onclick=()=>partJoin(i.value);
    i.addEventListener("keydown",e=>{if(e.key==="Enter")partJoin(i.value)});
    return;
  }
  if(P.done){
    w.innerHTML='<div class="pstage" style="text-align:center;padding-top:70px">'+
      '<h1 style="font-size:27px">'+t.pDone+'</h1><p class="lede" style="margin:0 auto">'+t.pDoneSub+'</p></div>';
    return;
  }

  const steps=PAIRS.length+1;
  let dots='<div class="dots">';
  for(let i=0;i<steps;i++) dots+='<span class="pdot '+(i<P.step?"on":i===P.step?"now":"")+'"></span>';
  dots+='</div>';

  if(P.step<PAIRS.length){
    const p=PAIRS[P.step];
    w.innerHTML='<div class="pstage">'+dots+
      '<p class="pq">'+(lang==="de"?"Was wiegt für Sie schwerer?":"Which weighs more for you?")+'</p>'+
      '<button class="opt" data-c="a" aria-pressed="'+(P.pairs[p.id]==="a")+'">'+esc(F(p.a))+'</button>'+
      '<button class="opt" data-c="b" aria-pressed="'+(P.pairs[p.id]==="b")+'">'+esc(F(p.b))+'</button>'+
      '<div class="row" style="margin-top:20px;justify-content:space-between">'+
      '<button class="btn btn-quiet" id="pb"'+(P.step===0?" disabled":"")+'>← '+t.pBack+'</button>'+
      '<button class="btn btn-primary" id="pn"'+(P.pairs[p.id]?"":" disabled")+'>'+t.pNext+' →</button></div></div>';
    w.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{P.pairs[p.id]=b.dataset.c;await pushPart();renderPart()});
    $("#pb").onclick=()=>{P.step--;renderPart()};
    $("#pn").onclick=()=>{P.step++;renderPart()};
    return;
  }

  w.innerHTML='<div class="pstage">'+dots+
    '<p class="pq">'+t.sortTitle+'</p>'+
    '<p class="lede">'+(lang==="de"?"Die obersten drei zählen. Pfeile benutzen oder Karten ziehen.":"The top three count. Use the arrows or drag the cards.")+'</p>'+
    '<ul class="cards" id="pcards"></ul>'+
    '<div class="row" style="margin-top:20px;justify-content:space-between">'+
    '<button class="btn btn-quiet" id="pb">← '+t.pBack+'</button>'+
    '<button class="btn btn-primary" id="psend" style="padding:12px 22px">'+t.pSend+'</button></div></div>';

  const ul=$("#pcards");
  const draw=()=>{
    ul.innerHTML=P.order.map((id,i)=>
      '<li class="card'+(i<3?" top3":"")+'" draggable="true" data-id="'+id+'">'+
      '<span class="rank">'+(i+1)+'</span><span class="card-label">'+esc(F(id))+'</span>'+
      '<button class="move" data-up="'+id+'" aria-label="hoch">↑</button>'+
      '<button class="move" data-dn="'+id+'" aria-label="runter">↓</button></li>').join("");
    ul.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{shiftIn(P,b.dataset.up,-1);pushPart();draw()});
    ul.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{shiftIn(P,b.dataset.dn,1);pushPart();draw()});
    wireDrag(ul,P,()=>{pushPart();draw()});
  };
  draw();
  $("#pb").onclick=()=>{P.step--;renderPart()};
  $("#psend").onclick=async()=>{P.done=true;await pushPart();renderPart()};
}

function snapshot(){
  return {tool:"to-trust-the-machine/v3",code:S.code,meta:Object.assign({},S.meta),
    durationSec:Math.floor(elapsed/1000),pairs:Object.assign({},S.pairs),order:S.order.slice(),
    top3:S.order.slice(0,3),anchor:S.anchor,notes:Object.assign({},S.notes),stamps:Object.assign({},S.stamps),
    quotes:Object.assign({},S.quotes),transcript:S.transcript,offset:S.offset,partWhy:S.partWhy,partMissing:S.partMissing,choices:Object.assign({},S.choices),newCodes:S.newCodes};
}
function download(name,text,mime){
  const b=new Blob([text],{type:mime+";charset=utf-8"});
  const u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500); toast(T().saved);
}
const csvCell=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';

function exportCsv(){
  const s=snapshot();
  const CH=[]; BLOCKS.forEach(b=>b.qs.forEach(q=>{if(q.opts)CH.push(q.id)}));
  const head=["code","industry","function","seniority","format","age_band","technical","date","duration_sec"]
    .concat(CH.map(x=>"choice_"+x), PAIRS.map(p=>p.id+"_winner"),
            FACTORS.map(f=>"rank_"+f.id), ["top3","anchor_factor","new_codes"]);
  const row=[s.code,s.meta.ind,s.meta.fun,s.meta.sen,s.meta.fmt,s.meta.age,s.meta.tec,s.meta.dat,s.durationSec]
    .concat(CH.map(x=>(s.choices&&s.choices[x])||""),
            PAIRS.map(p=>{const c=s.pairs[p.id];return c?(c==="a"?p.a:p.b):""}),
            FACTORS.map(f=>s.order.indexOf(f.id)+1),
            [s.top3.join(" > "), s.anchor.replace(/\s+/g," ").slice(0,300),
             (s.newCodes||"").replace(/\s+/g," ").slice(0,300)]);
  download(s.code+"_ranking.csv", head.map(csvCell).join(",")+"\n"+row.map(csvCell).join(",")+"\n","text/csv");
}
function exportMd(){
  const s=snapshot();
  let o="# "+s.code+" — "+(s.meta.fun||"?")+", "+(s.meta.ind||"?")+"\n\n"+
        s.meta.dat+" · "+(s.meta.fmt||"?")+" · "+Math.round(s.durationSec/60)+" min\n";
  BLOCKS.forEach(b=>{
    const rows=b.qs.filter(q=>(s.notes[q.id]||"").trim()||(s.stamps[q.id]||[]).length||(s.choices&&s.choices[q.id]));
    if(!rows.length)return;
    o+="\n## "+b.k+" · "+L(b).t+"\n\n";
    rows.forEach(q=>{
      o+="**"+q.id+"** — "+L(q)+"\n\n";
      if(q.opts&&s.choices&&s.choices[q.id]){
        const o2=q.opts.find(function(x){return x.id===s.choices[q.id]});
        if(o2) o+="Auswahl: **"+L(o2)+"**\n\n";
      }
      if((s.notes[q.id]||"").trim()) o+=s.notes[q.id].trim()+"\n\n";
      const st=s.stamps[q.id]||[];
      if(st.length) o+="> "+(lang==="de"?"Zeitmarken im Mitschnitt":"Timecodes")+": "+st.map(mmss).join(", ")+"\n\n";
    });
  });
  o+="\n## E · "+T().exTitle+"\n\n";
  PAIRS.forEach(p=>{const c=s.pairs[p.id];if(!c)return;
    o+="- "+p.id+": **"+F(c==="a"?p.a:p.b)+"** > "+F(c==="a"?p.b:p.a)+"\n"});
  o+="\n"+(lang==="de"?"Reihenfolge":"Order")+": "+s.order.map((id,i)=>(i+1)+". "+F(id)).join(" · ")+"\n";
  if(s.anchor.trim()) o+="\n**"+T().anchorLede+"**\n\n"+s.anchor.trim()+"\n";
  if((s.partWhy||"").trim()) o+="\n**"+(lang==="de"?"Warum Platz 1 oben steht":"Why first place is at the top")+"**\n\n"+s.partWhy.trim()+"\n";
  if((s.partMissing||"").trim()) o+="\n**"+(lang==="de"?"Fehlender Faktor":"Missing factor")+"**\n\n"+s.partMissing.trim()+"\n";
  download(s.code+"_notizen.md",o,"text/markdown");
}

function renderAgg(){
  const box=$("#aggOut"); if(!box) return;
  const c=$("#impCount");
  if(c) c.textContent = merged.length ? merged.length+(lang==="de"?" Interviews":" interviews") : "";
  if(!merged.length){ box.innerHTML='<p style="color:var(--faint);font-size:13px">'+T().noData+'</p>'; return; }

  const wins={}; PAIRS.forEach(p=>{wins[p.id]={};wins[p.id][p.a]=0;wins[p.id][p.b]=0;wins[p.id].n=0});
  merged.forEach(s=>PAIRS.forEach(p=>{
    const ch=s.pairs&&s.pairs[p.id]; if(!ch)return;
    wins[p.id][ch==="a"?p.a:p.b]++; wins[p.id].n++;
  }));
  const ranks={},tops={}; FACTORS.forEach(f=>{ranks[f.id]=[];tops[f.id]=0});
  merged.forEach(s=>{
    (s.order||[]).forEach((id,i)=>{if(ranks[id])ranks[id].push(i+1)});
    (s.top3||[]).forEach(id=>{if(tops[id]!==undefined)tops[id]++});
  });
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const sorted=FACTORS.slice().sort((x,y)=>(mean(ranks[x.id])==null?99:mean(ranks[x.id]))-(mean(ranks[y.id])==null?99:mean(ranks[y.id])));

  box.innerHTML=
    '<div><h3 style="font-size:14px;margin:0 0 10px">'+T().aggPair+'</h3><table><thead><tr><th>#</th><th>'+
      (lang==="de"?"Gewinnt":"Wins")+'</th><th class="num">n</th></tr></thead><tbody>'+
      PAIRS.map(p=>{
        const w=wins[p.id];
        const lead=w[p.a]===w[p.b]?(lang==="de"?"unentschieden":"tied"):F(w[p.a]>w[p.b]?p.a:p.b);
        return '<tr><td style="font-family:var(--mono);font-size:12px">'+p.id+'</td><td>'+esc(lead)+
          ' <span style="color:var(--faint);font-family:var(--mono);font-size:11px">'+w[p.a]+':'+w[p.b]+'</span></td>'+
          '<td class="num">'+w.n+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
    '<div><h3 style="font-size:14px;margin:0 0 10px">'+T().aggRank+'</h3><table><thead><tr><th>'+
      (lang==="de"?"Faktor":"Factor")+'</th><th class="num">⌀</th><th class="num">Top 3</th></tr></thead><tbody>'+
      sorted.map(f=>{
        const m=mean(ranks[f.id]); const pct=m?(1-(m-1)/(FACTORS.length-1))*100:0;
        return '<tr><td class="bar-cell"><span class="bar-fill" style="width:'+pct.toFixed(0)+'%"></span><span>'+esc(L(f))+'</span></td>'+
          '<td class="num">'+(m?m.toFixed(1):"—")+'</td><td class="num">'+tops[f.id]+'</td></tr>';
      }).join("")+'</tbody></table></div>'+aggModes()+aggEffect()+aggChoices()+aggSample();
}

function aggModes(){
  const de=lang==="de";
  let iv=0, sf=0;
  merged.forEach(function(x){
    const f=((x.meta&&x.meta.fmt)||"").toLowerCase();
    if(f.indexOf("schrift")>=0||f.indexOf("written")>=0) sf++; else iv++;
  });
  if(!sf) return "";
  return '<div style="grid-column:1/-1;border-left:3px solid var(--live);background:#FFF9EF;'+
    'padding:12px 14px;border-radius:0 6px 6px 0;font-size:13px;color:#6B4A0F">'+
    '<b>'+(de?"Zwei Erhebungsformen gemischt: ":"Two collection modes mixed: ")+iv+
    (de?" Gespräche, ":" interviews, ")+sf+(de?" schriftliche Fragebögen.":" written questionnaires.")+'</b> '+
    (de?"Diese Zahlen gehören in Kapitel 5 getrennt berichtet — schriftliche Antworten entstehen ohne Nachfragen und sind systematisch kürzer."
       :"Report these separately in chapter 5 — written answers arise without probing and are systematically shorter.")+'</div>';
}
function aggEffect(){
  const de=lang==="de";
  let n=0, diff=0, proSys=0, proHum=0;
  merged.forEach(function(s){
    const c=s.choices||{}; if(!c.V1||!c.V2) return;
    n++; const d=ADOPT[c.V1]-ADOPT[c.V2];
    if(d!==0){ diff++; if(d>0) proSys++; else proHum++; }
  });
  if(!n) return "";
  return '<div style="grid-column:1/-1;border:1px solid var(--signal);border-radius:8px;padding:16px 18px;background:var(--soft)">'+
    '<h3 style="font-size:14px;margin:0 0 6px">'+(de?"Quelleneffekt":"Source effect")+'</h3>'+
    '<p style="font-size:15.5px;margin:0 0 6px;color:var(--ink)"><b>'+diff+'</b>'+(de?" von ":" of ")+'<b>'+n+
    '</b>'+(de?" Teilnehmenden haben dieselbe Empfehlung unterschiedlich behandelt, je nachdem ob sie vom System oder von einem Menschen kam."
             :" participants treated the identical recommendation differently depending on whether it came from the system or a human.")+'</p>'+
    '<p style="font-size:13px;margin:0;color:var(--muted)">'+(de?"Weiter mitgegangen beim System: ":"Went further with the system: ")+proSys+
    (de?" · beim Menschen: ":" · with the human: ")+proHum+
    (de?" — als Häufigkeiten berichten, nicht als Prozent.":" — report as counts, never percentages.")+'</p></div>';
}
function aggChoices(){
  const de=lang==="de", out=[];
  BLOCKS.forEach(function(b){ b.qs.forEach(function(q){
    if(!q.opts) return;
    const counts={}; let n=0;
    merged.forEach(function(s){ const c=s.choices&&s.choices[q.id]; if(!c) return; counts[c]=(counts[c]||0)+1; n++; });
    if(!n) return;
    out.push('<div style="margin-bottom:18px"><h3 style="font-size:14px;margin:0 0 2px">'+q.id+'</h3>'+
      '<p style="font-size:12.5px;color:var(--faint);margin:0 0 8px">'+esc(L(q)).slice(0,110)+'</p>'+
      '<table><tbody>'+q.opts.map(function(o){
        const c=counts[o.id]||0;
        return '<tr><td class="bar-cell"><span class="bar-fill" style="width:'+(c/n*100).toFixed(0)+'%"></span>'+
          '<span>'+esc(L(o))+'</span></td><td class="num">'+c+'</td></tr>';
      }).join("")+'</tbody></table>'+
      '<p style="font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:5px 0 0">n = '+n+
      (de?" · als Häufigkeiten berichten, nicht als Prozent":" · report as counts, never as percentages")+'</p></div>');
  });});
  return out.length ? '<div>'+out.join("")+'</div>' : "";
}

function aggSample(){
  const de=lang==="de";
  const rows=merged.map(function(s){return {
    code:s.code, fun:(s.meta&&s.meta.fun)||"—", ind:(s.meta&&s.meta.ind)||"—",
    sen:(s.meta&&s.meta.sen)||"—", tec:(s.meta&&s.meta.tec)||"—",

      ? "Lücken in dieser Tabelle sind wichtiger als die Zeilenzahl. Sinkt die letzte Spalte auf null, ist Sättigung erreicht."
      : "Gaps in this table matter more than the number of rows. When the last column reaches zero, you have saturation.")+'</p>'+
    '<table><thead><tr><th>#</th><th>'+(de?"Funktion":"Function")+'</th><th>'+(de?"Branche":"Industry")+'</th>'+

/* ═══ 9a · Antwortvergleich ════════════════════════════════
   Drei Gegenüberstellungen, die sich aus den Antworten selbst
   ergeben. Neutral formuliert: Spannungen sind normal und
   kein Fehler der Person.
   ═══════════════════════════════════════════════════════════ */
const ADOPT={follow:2,adjust:1,reject:0};
const LAD={a:1,b:2,c:3,d:4,none:5};

function analyseAnswers(A){
  const de=lang==="de", ch=A.choices||{}, pr=A.pairs||{}, od=A.order||[];
  const out=[];

  /* 1 · Quelleneffekt: identischer Inhalt, andere Quelle */
  if(ch.V1 && ch.V2){
    const diff=ADOPT[ch.V1]-ADOPT[ch.V2];
    out.push(diff===0
      ? {tone:"ok",
         t:de?"Quelle machte keinen Unterschied":"Source made no difference",
         x:de?"Sie haben dieselbe Empfehlung gleich behandelt, egal ob sie vom System oder von der Kollegin kam."
             :"You treated the identical recommendation the same way, whether it came from the system or the colleague.",
         p:de?"Nachfassen: „Gibt es Fälle, in denen die Quelle für Sie doch etwas ändern würde?“"
             :"Probe: “Are there cases where the source would change something for you?”"}
      : {tone:"tension",
         t:de?"Die Quelle hat den Ausschlag gegeben":"The source tipped the balance",
         x:(de?"Inhalt und Begründung waren identisch. Beim ":"Content and reasoning were identical. You went further with the ")+
           (diff>0?(de?"System":"system"):(de?"Menschen":"human"))+
           (de?" sind Sie weiter mitgegangen als beim anderen.":" than with the other."),
         p:de?"Nachfassen: „Inhalt und Begründung waren identisch — woran genau lag der Unterschied?“"
             :"Probe: “Content and reasoning were identical — what exactly made the difference?”"});
  }

  /* 2 · Konfliktfall gegen die Einzelurteile */
  if(ch.V1&&ch.V2&&ch.V3&&ch.V3!=="own"){
    const lean = ADOPT[ch.V1]>ADOPT[ch.V2] ? "system" : ADOPT[ch.V2]>ADOPT[ch.V1] ? "human" : null;
    if(lean && ch.V3!==lean){
      out.push({tone:"tension",
        t:de?"Im Konflikt anders entschieden":"Decided differently under conflict",
        x:de?"Einzeln betrachtet sind Sie der einen Seite weiter gefolgt — im direkten Konflikt haben Sie sich dann für die andere entschieden."
            :"Taken separately you went further with one side — in the direct conflict you chose the other.",
        p:de?"Nachfassen: „Was ändert sich, wenn beide gleichzeitig auf dem Tisch liegen?“"
            :"Probe: “What changes when both are on the table at once?”"});
    }
  }

  /* 3 · Paarvergleiche gegen die Rangfolge */
  if(od.length===FACTORS.length && Object.keys(pr).length){
    const mism=[];
    PAIRS.forEach(function(p){
      const c=pr[p.id]; if(!c) return;
      const win=c==="a"?p.a:p.b, los=c==="a"?p.b:p.a;
      if(od.indexOf(win)>od.indexOf(los)) mism.push({p:p.id,win:win,los:los});
    });
    const nAsked=PAIRS.filter(function(p){return pr[p.id]}).length;
    out.push(mism.length===0
      ? {tone:"ok",
         t:de?"Abwägung und Reihenfolge passen zusammen":"Trade-offs and ranking agree",
         x:de?"Alle "+nAsked+" Einzelentscheidungen decken sich mit Ihrer Rangfolge."
             :"All "+nAsked+" individual choices match your ranking.",
         p:""}
      : {tone:"tension",
         t:de?mism.length+" von "+nAsked+" Abwägungen weichen von der Reihenfolge ab"
             :mism.length+" of "+nAsked+" trade-offs diverge from the ranking",
         x:mism.map(function(m){
             return (de?"Einzeln wog ":"Alone, ")+F(m.win)+(de?" schwerer als ":" outweighed ")+F(m.los)+
                    (de?" — in der Reihenfolge steht es darunter.":" — in the ranking it sits below it.")}).join(" "),
         p:de?"Nachfassen: „Bei "+F(mism[0].win)+" gegen "+F(mism[0].los)+" hatten Sie sich anders entschieden — was war da anders?“"
             :"Probe: “You chose differently on "+F(mism[0].win)+" versus "+F(mism[0].los)+" — what was different there?”"});
  }

  /* 4 · Tragweite */
  if(ch.L1){
    const lab={a:de?"schon bei einer Wochenplanung":"already at weekly planning",
               b:de?"ab 50 000 € Budget":"from €50,000 of budget",
               c:de?"erst bei einer Standortschließung":"only at closing a site",
               d:de?"erst bei einer Personalentscheidung":"only at a personnel decision",
               none:de?"bei keiner der vier Stufen":"at none of the four levels"}[ch.L1];
    const odd = ch.L1==="none" && ch.V1==="reject";
    out.push({tone:odd?"tension":"neutral",
      t:de?"Ihre Grenze liegt "+lab:"Your limit sits "+lab,
      x:odd?(de?"Zugleich haben Sie den Systemvorschlag in der Vignette nicht übernommen."
                :"At the same time you did not adopt the system's suggestion in the vignette.")
           :(de?"Ab hier wird der Vorschlag nicht mehr ungeprüft übernommen."
                :"From here the suggestion is no longer adopted unchecked."),
      p:odd?(de?"Nachfassen: „Sie sagten, es gäbe keine Grenze — in der Vignette sind Sie aber nicht mitgegangen.“"
                :"Probe: “You said there is no limit — but in the vignette you did not go along.”"):""});
  }
  return out;
}

function analyseHtml(A,withProbe){
  const items=analyseAnswers(A);
  if(!items.length) return "";
  const col={tension:"var(--live)",ok:"var(--ok)",neutral:"var(--faint)"};
  return items.map(function(it){
    return '<div style="border-left:3px solid '+col[it.tone]+';padding:2px 0 2px 14px;margin:0 0 16px">'+
      '<div style="font-weight:600;font-size:15.5px;margin-bottom:3px">'+esc(it.t)+'</div>'+
      '<p style="margin:0;font-size:14.5px;color:var(--muted)">'+esc(it.x)+'</p>'+
      (withProbe&&it.p?'<p style="margin:7px 0 0;font-size:13.5px;color:var(--signal);font-style:italic">'+esc(it.p)+'</p>':'')+
      '</div>';
  }).join("");
}

/* ═══ 9b · Transkript → Zitate ═════════════════════════════
   Die Zeitmarken aus dem Leitfaden sind Sekunden ab Gesprächsbeginn.
   Das Transkript hat seine eigene Uhr. Ein einmalig bestimmter Versatz
   bringt beide zur Deckung; danach lässt sich zu jeder Marke der
   passende Ausschnitt herausziehen.
   ═══════════════════════════════════════════════════════════ */
let TR={lines:[],pre:20,post:60,pick:false};

function parseTranscript(raw){
  const tsRe=/^\s*[\[\(]?(\d{1,2}):(\d{2})(?::(\d{2}))?(?:[.,]\d{1,3})?[\]\)]?\s*[-–—]?\s*(.*)$/;
  const spRe=/^(?:\*\*)?\s*([\wÄÖÜäöüß .\-]{1,28}?)\s*(?:\*\*)?\s*:\s+(.*)$/;
  const out=[];
  raw.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const m=line.match(tsRe);
    if(m){
      const h=m[3]!==undefined?+m[1]:0;
      const mi=m[3]!==undefined?+m[2]:+m[1];
      const se=m[3]!==undefined?+m[3]:+m[2];
      let rest=m[4]||"", spk="";
      const s=rest.match(spRe);
      if(s){ spk=s[1].trim(); rest=s[2]; }
      out.push({t:h*3600+mi*60+se, spk, txt:rest.trim()});
    }else if(out.length){
      const s=line.match(spRe);
      if(s){ out.push({t:out[out.length-1].t, spk:s[1].trim(), txt:s[2].trim()}); }
      else { out[out.length-1].txt += " "+line.trim(); }
    }
  });
  return out;
}
function allStamps(){
  const out=[];
  BLOCKS.forEach(b=>b.qs.forEach(q=>{
    (S.stamps[q.id]||[]).forEach(ms=>out.push({qid:q.id, q, block:b, t:Math.floor(ms/1000)}));
  }));
  return out.sort((a,b)=>a.t-b.t);
}
function windowText(tSec){
  const from=tSec+S.offset-TR.pre, to=tSec+S.offset+TR.post;
  return TR.lines.filter(l=>l.t>=from && l.t<=to)
                 .map(l=>(l.spk?l.spk+": ":"")+l.txt).join("\n");
}
const hms=s=>{s=Math.max(0,Math.round(s));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

function renderTranscript(){
  const v=$("#view-transcript");
  const de=lang==="de";
  TR.lines=parseTranscript(S.transcript||"");
  const stamps=allStamps();
  const hasTs=TR.lines.length>0;

  v.innerHTML=
    '<p class="eyebrow">'+(de?"Auswertung":"Analysis")+'</p>'+
    '<h1>'+(de?"Transkript und Zitate":"Transcript and quotes")+'</h1>'+
    '<div class="srq">'+(de
      ? "Transkript einfügen, Versatz bestimmen, Ausschnitte kürzen — Ergebnis ist eine Zitatliste für Kapitel 5."
      : "Paste the transcript, set the offset, trim the excerpts — the result is a quote sheet for chapter 5.")+'</div>'+

    '<div class="panel"><h3>1 · '+(de?"Transkript einfügen":"Paste transcript")+'</h3>'+
    '<p>'+(de
      ? "Aus Granola: Einstellungen → Profil → CSV erzeugen, oder die Notiz öffnen und das Transkript kopieren. Nötig sind Zeitangaben am Zeilenanfang, etwa 00:14:22 oder 14:22."
      : "From Granola: Settings → Profile → Generate CSV, or open the note and copy the transcript. Timestamps at the start of each line are required.")+'</p>'+
    '<textarea class="note" id="trRaw" style="width:100%;min-height:130px;font-family:var(--mono);font-size:12.5px" '+
    'placeholder="00:00:12  Me: Vielen Dank, dass Sie sich Zeit nehmen …">'+esc(S.transcript||"")+'</textarea>'+
    '<p style="margin:10px 0 0;font-family:var(--mono);font-size:11.5px;color:'+(hasTs?"var(--ok)":"var(--faint)")+'">'+
      (hasTs ? TR.lines.length+(de?" Zeilen erkannt":" lines detected")
             : (de?"Noch keine Zeilen mit Zeitangabe erkannt.":"No timestamped lines detected yet."))+'</p></div>'+

    '<div class="panel"><h3>2 · '+(de?"Versatz bestimmen":"Set the offset")+'</h3>'+
    '<p>'+(de
      ? "Deine Uhr startete beim Drücken von Start, die Aufnahme womöglich Sekunden früher. Trag den Unterschied ein — oder klick unten die Transkriptzeile an, an der deine erste Zeitmarke liegt."
      : "Your clock started when you pressed Start; the recording may have begun seconds earlier. Enter the difference, or click the transcript line where your first stamp falls.")+'</p>'+
    '<div class="row">'+
      '<div class="field" style="max-width:150px"><label>'+(de?"Versatz (Sek.)":"Offset (sec)")+'</label>'+
        '<input id="trOff" type="number" value="'+(S.offset||0)+'"></div>'+
      '<div class="field" style="max-width:120px"><label>'+(de?"davor":"before")+'</label>'+
        '<input id="trPre" type="number" value="'+TR.pre+'"></div>'+
      '<div class="field" style="max-width:120px"><label>'+(de?"danach":"after")+'</label>'+
        '<input id="trPost" type="number" value="'+TR.post+'"></div>'+
      (stamps.length&&hasTs?'<button class="btn" id="trPick" aria-pressed="'+TR.pick+'" style="align-self:flex-end">'+
        (de?"Erste Marke zuordnen":"Locate first stamp")+'</button>':"")+
    '</div>'+
    (TR.pick?'<div class="warn" style="margin:14px 0 0">'+(de
      ? "Klick jetzt unten im Transkript die Zeile an, an der deine erste Zeitmarke ("+hms(stamps[0].t)+", Frage "+stamps[0].qid+") liegt."
      : "Now click the transcript line where your first stamp ("+hms(stamps[0].t)+", question "+stamps[0].qid+") falls.")+'</div>':"")+
    (TR.pick?'<div id="trLines" style="max-height:280px;overflow:auto;margin-top:12px;border:1px solid var(--rule);border-radius:6px">'+
      TR.lines.map((l,i)=>'<div class="trline" data-i="'+i+'" style="padding:6px 10px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13px">'+
      '<span style="font-family:var(--mono);font-size:11px;color:var(--faint)">'+hms(l.t)+'</span> '+
      (l.spk?'<b>'+esc(l.spk)+':</b> ':'')+esc(l.txt.slice(0,140))+'</div>').join("")+'</div>':"")+
    '</div>'+

    '<div class="panel"><h3>3 · '+(de?"Zitate":"Quotes")+'</h3>'+
    '<p>'+(de
      ? stamps.length+" Zeitmarke(n) aus dem Leitfaden. Jeder Ausschnitt ist ein Vorschlag — kürz ihn auf den Satz, den du wirklich zitieren willst."
      : stamps.length+" stamp(s) from the guide. Each excerpt is a proposal — trim it to the sentence you actually want.")+'</p>'+
    (!stamps.length
      ? '<p style="color:var(--faint);font-size:13px;margin:0">'+(de
          ? "Noch keine Zeitmarken gesetzt. Im Leitfaden während des Gesprächs auf „Zitat“ drücken."
          : "No stamps yet. Press Quote in the guide during the interview.")+'</p>'
      : stamps.map(s=>{
          const key=s.qid+"@"+s.t;
          const val = S.quotes[key]!==undefined ? S.quotes[key] : (hasTs?windowText(s.t):"");
          return '<div style="border-top:1px solid var(--rule);padding:14px 0">'+
            '<div class="row" style="gap:10px;margin-bottom:6px">'+
            '<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--signal)">'+s.qid+'</span>'+
            '<span style="font-family:var(--mono);font-size:11px;color:var(--faint)">'+hms(s.t)+' → '+hms(s.t+(S.offset||0))+'</span></div>'+
            '<p style="font-size:14px;margin:0 0 8px;color:var(--muted)">'+esc(L(s.q))+'</p>'+
            '<textarea class="note" data-quote="'+key+'" style="width:100%;min-height:76px">'+esc(val)+'</textarea>'+
            '</div>';
        }).join("")
    )+
    (stamps.length?'<div class="row" style="margin-top:16px">'+
      '<button class="btn btn-primary" id="trExport">'+(de?"Zitatliste sichern":"Save quote sheet")+'</button>'+
      '<button class="btn btn-quiet" id="trReset">'+(de?"Ausschnitte neu ziehen":"Re-extract excerpts")+'</button></div>':"")+
    '</div>';

  const raw=$("#trRaw");
  if(raw) raw.addEventListener("input",e=>{S.transcript=e.target.value;markSave();
    clearTimeout(raw._r); raw._r=setTimeout(renderTranscript,700)});
  const off=$("#trOff");
  if(off) off.addEventListener("change",e=>{S.offset=+e.target.value||0;markSave();renderTranscript()});
  const pre=$("#trPre"), post=$("#trPost");
  if(pre) pre.addEventListener("change",e=>{TR.pre=+e.target.value||0;renderTranscript()});
  if(post) post.addEventListener("change",e=>{TR.post=+e.target.value||0;renderTranscript()});
  const pick=$("#trPick");
  if(pick) pick.onclick=()=>{TR.pick=!TR.pick;renderTranscript()};
  v.querySelectorAll(".trline").forEach(el=>el.onclick=()=>{
    const l=TR.lines[+el.dataset.i];
    S.offset=Math.round(l.t-stamps[0].t); TR.pick=false; markSave(); renderTranscript();
    toast((de?"Versatz: ":"Offset: ")+S.offset+" s");
  });
  v.querySelectorAll("[data-quote]").forEach(t=>t.addEventListener("input",e=>{
    S.quotes[e.target.dataset.quote]=e.target.value; markSave();
  }));
  const rst=$("#trReset");
  if(rst) rst.onclick=()=>{S.quotes={};markSave();renderTranscript()};
  const exp=$("#trExport");
  if(exp) exp.onclick=()=>exportQuotes(stamps);
}

function exportQuotes(stamps){
  const de=lang==="de";
  let o="# "+S.code+" — "+(de?"Zitatliste":"Quote sheet")+"\n\n"+
        (S.meta.fun||"?")+", "+(S.meta.ind||"?")+" · "+(S.meta.dat||"")+"\n\n"+
        "> "+(de
          ? "Zuordnung nach Frage. In Kapitel 5 nur Rolle und Branche nennen, z. B. „Interviewee 3, Finanzen“."
          : "Ordered by question. In chapter 5 attribute by role and industry only.")+"\n";
  let lastBlock="";
  stamps.forEach(s=>{
    if(s.block.k!==lastBlock){ o+="\n## "+s.block.k+" · "+L(s.block).t+"\n\n_"+s.block.srq+"_\n\n"; lastBlock=s.block.k; }
    const q=S.quotes[s.qid+"@"+s.t];
    o+="**"+s.qid+"** — "+L(s.q)+"\n\n";
    o+="`"+hms(s.t)+"`"+(S.offset?" ("+(de?"Aufnahme":"recording")+" "+hms(s.t+S.offset)+")":"")+"\n\n";
    o+=(q&&q.trim()? q.trim().split(/\n/).map(x=>"> "+x).join("\n") : "> ["+(de?"Ausschnitt fehlt":"excerpt missing")+"]")+"\n\n";
  });
  download(S.code+"_zitate.md",o,"text/markdown");
}

const CHMAP={F:"follow",A:"adjust",R:"reject",S:"system",H:"human",O:"own",
             "1":"a","2":"b","3":"c","4":"d","0":"none"};
function choiceQids(){
  const out=[]; BLOCKS.forEach(b=>b.qs.forEach(q=>{if(q.opts)out.push(q.id)}));
  return out;
}
function applyResultCode(str){
  const raw=String(str||"").trim().toUpperCase();
  let m=raw.match(/^E-([A-Z0-9-]{2,8})-([AB-]{4})-(\d{8})$/);
  let ch=null, pr, od;
  if(m){ ch=m[1]; pr=m[2]; od=m[3]; }
  else {
    m=raw.match(/^E-([AB-]{4})-(\d{8})$/);           // ältere Fassung ohne Aufgaben
    if(!m) return false;
    pr=m[1]; od=m[2];
  }
  const ids=FACTORS.map(f=>f.id);
  const digits=od.split("").map(Number);
  if(new Set(digits).size!==8 || digits.some(d=>d<1||d>8)) return false;
  if(ch){
    const qids=choiceQids();
    ch.split("").forEach(function(c,i){
      if(qids[i] && CHMAP[c]) S.choices[qids[i]]=CHMAP[c];
    });
  }
  PAIRS.forEach((p,i)=>{const c=pr[i]; if(c==="A"||c==="B") S.pairs[p.id]=c.toLowerCase();});
  S.order=digits.map(d=>ids[d-1]);
  markSave(); renderRank(); renderGuide();
  return true;
}

const bin=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  if(!(window.crypto && window.crypto.subtle)) return "nocrypto";
  try{
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:bin(VAULT.salt),iterations:VAULT.it,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:bin(VAULT.iv)},key,bin(VAULT.ct));
    BLOCKS=JSON.parse(new TextDecoder().decode(out));
    return true;
  }catch(_){ return false; }
}

function showLock(){
  VIEW="lock";
  document.getElementById("partWrap").hidden=true;

  document.getElementById("lockWrap").hidden=false;
  const w=document.getElementById("lockWrap"), de=lang==="de";

    '<h1 style="font-size:24px">'+(de?"Moderation":"Moderation")+'</h1>'+
    '<p class="lede">'+(de?"Der Leitfaden ist verschlüsselt in dieser Datei abgelegt und wird erst durch das Passwort lesbar."

    '<input type="password" id="pw" style="width:100%;font-size:17px;padding:13px;border:1px solid var(--rule);border-radius:7px;background:var(--surface)" autocomplete="current-password">'+
    '<div class="row" style="margin-top:12px;gap:10px">'+
    '<button class="btn btn-primary" id="pwGo" style="flex:1;padding:12px">'+(de?"Entsperren":"Unlock")+'</button>'+
    '<button class="btn btn-quiet" id="pwBack">'+(de?"Abbrechen":"Cancel")+'</button></div>'+
    '<p id="pwErr" style="color:var(--over);font-size:13.5px;margin-top:12px;display:none">'+
      (de?"Passwort stimmt nicht.":"Wrong password.")+'</p></div>';

      const e=w.querySelector("#pwErr");
      e.textContent = de
        ? "Die Entschlüsselung steht in diesem Fenster nicht zur Verfügung. Das passiert bei unverschlüsselten Verbindungen — bitte die Seite über https:// aufrufen oder die Datei direkt öffnen."

      e.style.display="block"; return;
    }
    if(!ok){ w.querySelector("#pwErr").style.display="block"; inp.select(); return; }
    unlocked=true; showModerator();
  };
  w.querySelector("#pwGo").onclick=go;
  w.querySelector("#pwBack").onclick=showParticipant;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}
