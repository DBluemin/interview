  const CH="follow:F,adjust:A,reject:R,system:S,human:H,own:O,a:1,b:2,c:3,d:4,none:0"
    .split(",").reduce((m,x)=>{const p=x.split(":");m[p[0]]=p[1];return m},{});

  function code(){
    const c=PQ.map(x=>CH[A.choices[x.id]]||"-").join("");
    const p=PAIRS.map(x=>(A.pairs[x.id]||"-").toUpperCase()).join("");
    const o=A.order.map(id=>FACTORS.findIndex(f=>f.id===id)+1).join("");
    return "E-"+c+"-"+p+"-"+o;
  }
  function freeText(){
    const out=[];
    PQ.forEach(x=>{ if((A.reasons[x.id]||"").trim()) out.push(x.id+": "+A.reasons[x.id].trim()); });
    if(A.why.trim()) out.push((lang==="de"?"Platz 1: ":"First place: ")+A.why.trim());
    if(A.missing.trim()) out.push((lang==="de"?"Fehlt: ":"Missing: ")+A.missing.trim());
    return out.join("\n");
  }
  async function push(done){
    if(!roomCode) return;
    try{
      await DB.set("ttm:room:"+roomCode+":p:"+pid,
        {pid,joinedAt:joined,mode:A.mode,answers:A.answers,choices:A.choices,reasons:A.reasons,pairs:A.pairs,order:A.order,
         why:A.why,missing:A.missing,done:!!done,at:Date.now()},true);
    }catch(_){}
  }
  const TOTAL=()=>SCR().length;
  function dots(n){
    let h='<div class="dots">';
    for(let i=0;i<TOTAL();i++) h+='<span class="pdot '+(i<n?"on":i===n?"now":"")+'"></span>';
    return h+'</div>';
  }
  function mv(id,d){
    const i=A.order.indexOf(id), j=i+d;
    if(j<0||j>=A.order.length) return;
    const x=A.order[i]; A.order[i]=A.order[j]; A.order[j]=x; push(false);
  }
  const navRow=(backDisabled,nextDisabled,nextLabel,id2)=>
    '<div class="row" style="margin-top:24px;justify-content:space-between">'+
    '<button class="btn btn-quiet" id="bk"'+(backDisabled?" disabled":"")+'>\u2190 '+t().back+'</button>'+
    '<button class="btn btn-primary" id="'+(id2||"nx")+'"'+(nextDisabled?" disabled":"")+
    ' style="padding:12px 22px">'+nextLabel+'</button></div>';

  function render(){
    const s=document.getElementById("partWrap"), T2=t();

    if(step===-2){
      s.innerHTML='<div class="pstage">'+
        '<h1 style="font-size:27px">'+T2.welcome+'</h1>'+
        '<p style="color:var(--ink)">'+T2.intro+'</p><p class="lede">'+T2.intro2+'</p>'+
        '<p class="eyebrow" style="margin:0 0 5px">'+T2.aboutT+'</p>'+
        '<p class="lede" style="font-size:14.5px;margin:0 0 18px">'+T2.about+'</p>'+
        '<div style="border-left:3px solid var(--rule);padding:2px 0 2px 13px;font-size:14px;color:var(--muted);margin:0 0 22px">'+T2.privacy+'</div>'+
        '<button class="btn btn-primary" id="go" style="width:100%;padding:15px;font-size:16px">'+T2.begin+'</button>'+
        '<div class="row" style="margin-top:12px;justify-content:center">'+
        '<button class="btn btn-quiet" id="hasCode">'+T2.haveCode+'</button></div></div>';
      s.querySelector("#go").onclick=()=>{step=-3;render()};
      s.querySelector("#hasCode").onclick=()=>{step=-1;render()};
      return;
    }

    if(step===-3){
      s.innerHTML='<div class="pstage"><h2 style="font-size:21px">'+T2.forkQ+'</h2>'+
        '<p class="lede">'+T2.forkHint+'</p>'+
        '<button class="opt" id="fInt">'+T2.forkYes+'</button>'+
        '<button class="opt" id="fSelf">'+T2.forkNo+'</button>'+
        '<div class="row" style="margin-top:16px"><button class="btn btn-quiet" id="bk">\u2190 '+T2.back+'</button></div></div>';
      s.querySelector("#fInt").onclick=()=>{A.mode="interview";step=0;render()};
      s.querySelector("#fSelf").onclick=()=>{A.mode="self";step=0;render()};
      s.querySelector("#bk").onclick=()=>{step=-2;render()};
      return;
    }
    if(step===-1){
      s.innerHTML='<div class="pstage"><h2 style="font-size:21px">'+T2.codeTitle+'</h2>'+
        '<p class="lede">'+T2.codeHint+'</p>'+
        '<input class="bigcode" id="cin" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">'+
        '<button class="btn btn-primary" id="cgo" style="width:100%;margin-top:12px;padding:14px">'+T2.codeGo+'</button>'+
        '<div class="row" style="margin-top:12px;justify-content:center">'+
        '<button class="btn btn-quiet" id="cskip">'+T2.codeBack+'</button></div></div>';
      const i=s.querySelector("#cin"); i.focus();
      const go=async()=>{
        const c=(i.value||"").trim().toUpperCase();
        if(c.length!==4||!DB.canRoom){ toast(T2.codeBad); return; }
        const meta=await DB.get("ttm:room:"+c,true);
        if(!meta){ toast(T2.codeBad); return; }
        roomCode=c; joined=Date.now(); A.mode="interview";
        pid=Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");
        await push(false); step=0; render();
      };
      s.querySelector("#cgo").onclick=go;
      i.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
      s.querySelector("#cskip").onclick=()=>{step=-3;render()};
      return;
    }

    const scr=SCR(), cur=scr[step];

    /* Schriftliche Fragen */
    if(cur && cur.t==="form"){
      const b=cur.b;
      s.innerHTML='<div class="pstage">'+dots(step)+
        '<p class="eyebrow">'+esc(b.t[lang])+'</p>'+
        '<p class="lede" style="margin-top:6px">'+T2.formHint+'</p>'+
        b.qs.map(function(q){
          return '<div style="margin-bottom:20px"><p style="font-size:16.5px;line-height:1.4;margin:0 0 7px;color:var(--ink)'+
            (q.key?';font-weight:560':'')+'">'+esc(q.q[lang])+'</p>'+
            '<textarea class="note" data-a="'+q.id+'" style="width:100%;min-height:70px;font-size:16px">'+
            esc(A.answers[q.id]||"")+'</textarea></div>';
        }).join("")+
        navRow(false,false,T2.next+' \u2192')+'</div>';
      s.querySelectorAll("[data-a]").forEach(function(t){
        t.addEventListener("input",function(e){A.answers[e.target.dataset.a]=e.target.value});
      });
      s.querySelector("#bk").onclick=()=>{step--;render()};
      s.querySelector("#nx").onclick=()=>{push(false);step++;render()};
      return;
    }

    /* Vignette und Leiter */
    if(cur && cur.t==="choice"){
      const q=cur.q, chosen=A.choices[q.id];
      s.innerHTML='<div class="pstage">'+dots(step)+
        (q.scene?'<div class="scene">'+T2.scene+'</div>':'')+
        (q.ladder?'<div class="scene">'+T2.ladderIntro+'</div>':'')+
        '<h2 style="font-size:21px;margin-bottom:18px">'+esc(q.q[lang])+'</h2>'+
        q.opts.map(o=>'<button class="opt" data-o="'+o.id+'" aria-pressed="'+(chosen===o.id)+'">'+esc(o[lang])+'</button>').join("")+
        '<div style="margin-top:18px"><p class="lede" style="margin-bottom:8px">'+T2.reason+'</p>'+
        '<textarea class="note" id="rsn" style="width:100%;min-height:62px;font-size:16px">'+esc(A.reasons[q.id]||"")+'</textarea></div>'+
        navRow(step===0,!chosen,T2.next+' \u2192')+'</div>';
      s.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{A.choices[q.id]=b.dataset.o;await push(false);render()});
      s.querySelector("#rsn").addEventListener("input",e=>{A.reasons[q.id]=e.target.value});
      s.querySelector("#bk").onclick=()=>{step--;render()};
      s.querySelector("#nx").onclick=()=>{push(false);step++;render()};
      return;
    }

    /* Paarvergleiche */
    if(cur && cur.t==="pair"){
      const p=cur.p, first=scr.findIndex(function(x){return x.t==="pair"})===step;
      s.innerHTML='<div class="pstage">'+dots(step)+
        (first?'<div class="scene">'+T2.pairIntro+'</div>':'')+
        '<h2 style="font-size:21px;margin-bottom:18px">'+T2.pairQ+'</h2>'+
        '<button class="opt" data-c="a" aria-pressed="'+(A.pairs[p.id]==="a")+'">'+esc(F(p.a))+'</button>'+
        '<button class="opt" data-c="b" aria-pressed="'+(A.pairs[p.id]==="b")+'">'+esc(F(p.b))+'</button>'+
        navRow(false,!A.pairs[p.id],T2.next+' \u2192')+'</div>';
      s.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{A.pairs[p.id]=b.dataset.c;await push(false);render()});
      s.querySelector("#bk").onclick=()=>{step--;render()};
      s.querySelector("#nx").onclick=()=>{step++;render()};
      return;
    }

    /* Sortieren */
    if(cur && cur.t==="sort"){
      s.innerHTML='<div class="pstage">'+dots(step)+
        '<h2 style="font-size:21px">'+T2.sortQ+'</h2><p class="lede">'+T2.sortHint+'</p>'+
        '<ul class="cards" id="pcards"></ul>'+navRow(false,false,T2.next+' \u2192')+'</div>';
      const ul=s.querySelector("#pcards");
      const draw=()=>{
        ul.innerHTML=A.order.map((id,i)=>
          '<li class="card'+(i<3?" top3":"")+'" draggable="true" data-id="'+id+'">'+
          '<span class="rank">'+(i+1)+'</span><span class="card-label">'+esc(F(id))+'</span>'+
          '<button class="move" data-up="'+id+'">\u2191</button>'+
          '<button class="move" data-dn="'+id+'">\u2193</button></li>').join("");
        ul.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{mv(b.dataset.up,-1);draw()});
        ul.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{mv(b.dataset.dn,1);draw()});
        wireDrag(ul,A,()=>{push(false);draw()});
      };
      draw();
      s.querySelector("#bk").onclick=()=>{step--;render()};
      s.querySelector("#nx").onclick=()=>{step++;render()};
      return;
    }

    /* Freitext */
    if(cur && cur.t==="free"){
      s.innerHTML='<div class="pstage">'+dots(step)+
        '<h2 style="font-size:21px">'+T2.whyQ+'</h2><p class="lede">'+T2.whyHint+'</p>'+
        '<textarea class="note" id="why" style="width:100%;min-height:88px;font-size:16px">'+esc(A.why)+'</textarea>'+
        '<h2 style="font-size:21px;margin-top:26px">'+T2.missQ+'</h2><p class="lede">'+T2.missHint+'</p>'+
        '<textarea class="note" id="miss" style="width:100%;min-height:64px;font-size:16px">'+esc(A.missing)+'</textarea>'+
        navRow(false,false,T2.send,"fin")+'</div>';
      s.querySelector("#why").addEventListener("input",e=>{A.why=e.target.value});
      s.querySelector("#miss").addEventListener("input",e=>{A.missing=e.target.value});
      s.querySelector("#bk").onclick=()=>{step--;render()};
      s.querySelector("#fin").onclick=async()=>{await push(true);step=999;render()};
      return;
    }

    /* Fertig */
    // Debriefing: Hintergrund und Quellen erst NACH der letzten Antwort —
    // vorher gezeigt, würden sie das Antwortverhalten verändern (Priming).
    const basis='<h2 style="font-size:17px;margin:30px 0 6px">'+t().basisT+'</h2>'+
      '<p class="lede" style="font-size:14px">'+t().basis+'</p>'+
      '<ul style="font-size:13.5px;color:var(--muted);line-height:1.55;padding-left:18px;margin:8px 0 0">'+
      t().basisRefs.map(function(r){return '<li>'+r+'</li>'}).join("")+'</ul>';
    if(roomCode){
      const mir=analyseHtml({choices:A.choices,pairs:A.pairs,order:A.order},false);
      s.innerHTML='<div class="pstage" style="padding-top:40px">'+
        '<h1 style="font-size:26px">'+T2.doneTitle+'</h1><p class="lede">'+T2.doneLive+'</p>'+
        (mir?'<h2 style="font-size:19px;margin:26px 0 4px">'+T2.mirrorT+'</h2><p class="lede">'+T2.mirrorL+'</p>'+mir:'')+basis+'</div>';
      return;
    }
    const c=code(), ft=freeText();
    const mirror=analyseHtml({choices:A.choices,pairs:A.pairs,order:A.order},false);
    s.innerHTML='<div class="pstage"><h1 style="font-size:26px;margin-top:20px">'+T2.doneTitle+'</h1>'+
      (mirror?'<h2 style="font-size:19px;margin:22px 0 4px">'+T2.mirrorT+'</h2>'+
              '<p class="lede">'+T2.mirrorL+'</p>'+mirror:'')+
      '<p class="lede">'+T2.doneCode+'</p>'+
      '<div id="res" style="font-family:var(--mono);font-size:clamp(17px,4.6vw,25px);font-weight:700;letter-spacing:.06em;color:var(--signal);background:var(--soft);border-radius:8px;padding:20px 14px;text-align:center;word-break:break-all;margin:0 0 14px">'+c+'</div>'+
      (ft?'<p class="lede" style="margin-bottom:8px">'+T2.extra+'</p>'+
          '<pre style="white-space:pre-wrap;font-family:var(--sans);font-size:14.5px;background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:13px;margin:0 0 14px">'+esc(ft)+'</pre>':'')+
      (A.mode==="self"
        ? '<div class="row"><button class="btn btn-primary" id="dl">'+T2.dlSelf+'</button>'+
          '<button class="btn" id="mail">'+T2.mail+'</button></div>'+
          '<p class="lede" style="margin-top:14px">'+T2.mailHint+'</p>'
        : '<div class="row"><button class="btn btn-primary" id="cp">'+T2.copy+'</button>'+
          '<button class="btn btn-quiet" id="dl">'+T2.dl+'</button></div>')+basis+'</div>';
    const mb=s.querySelector("#mail");
    if(mb) mb.onclick=()=>{
      location.href="mailto:"+MAILTO+"?subject="+encodeURIComponent(T2.mailSubj)+
        "&body="+encodeURIComponent(T2.mailBody+"\n\n"+c);
    };
    const cpb=s.querySelector("#cp");
    if(cpb) cpb.onclick=async()=>{
      try{ await navigator.clipboard.writeText(ft?c+"\n\n"+ft:c); toast(T2.copied); }catch(_){ toast(T2.copied); }
    };
    s.querySelector("#dl").onclick=()=>{
      download("abwaegung.json",JSON.stringify(
        {tool:"to-trust-the-machine/participant",mode:A.mode,code:c,answers:A.answers,choices:A.choices,reasons:A.reasons,
         pairs:A.pairs,order:A.order,top3:A.order.slice(0,3),why:A.why,missing:A.missing,
         at:new Date().toISOString()},null,2),"application/json");
    };
  }
  return {render};
})();

/* ═══ 10 · Verdrahtung ═════════════════════════════════════ */
function setView(name){
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===name)));
  ["session","room","rank","transcript","data"].forEach(v=>$("#view-"+v).hidden=(v!==name));
  document.querySelector(".gutter").style.visibility = name==="session"?"visible":"hidden";
  if(name==="room") renderRoom();
  if(name==="rank") renderRank();
  if(name==="transcript") renderTranscript();
  if(name==="data") renderData();
}
$$(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.view));

$("#toggleTimer").onclick=()=>{
  running=!running;
  $("#toggleTimer").textContent=running?T().pause:T().start;
  if(running) tickRef=setInterval(()=>{elapsed+=1000;paintClock();paintPlayhead()},1000);
  else { clearInterval(tickRef); markSave(); }
  paintClock();
};
$("#resetTimer").onclick=()=>{running=false;clearInterval(tickRef);elapsed=0;
  $("#toggleTimer").textContent=T().start;paintClock();paintPlayhead()};
$("#pcode").oninput=e=>{S.code=(e.target.value.trim().toUpperCase())||"I1";markSave()};
$("#anchorNote").addEventListener("input",e=>{S.anchor=e.target.value;markSave()});
$("#switchBtn").onclick=()=>{ VIEW==="mod" ? showParticipant() : (unlocked?showModerator():showLock()); };

$("#langBtn").onclick=()=>{
  lang = lang==="de" ? "en" : "de";
  $("#langBtn").textContent = lang==="de" ? "EN" : "DE";
  $("#toggleTimer").textContent = running ? T().pause : T().start;
  $("#resetTimer").textContent = T().reset;
  $("#footNote").textContent = T().foot;
  if(VIEW==="part"){ showParticipant(); return; }
  if(VIEW==="lock"){ showLock(); return; }
  if(!$("#view-room").hidden) renderRoom();
  if(!$("#view-data").hidden) renderData();
  showModerator();
  setSaveState(DB.kind==="memory"?"off":"on");
};

window.addEventListener("beforeunload",e=>{
  if(DB.kind==="memory"){
    const any=Object.keys(S.notes).some(k=>S.notes[k]&&S.notes[k].trim());
    if(any){ e.preventDefault(); e.returnValue=""; }
  }
});

$("#footNote").textContent=UI.de.foot;
showParticipant();
setSaveState(DB.kind==="memory"?"off":"on");

</script>
